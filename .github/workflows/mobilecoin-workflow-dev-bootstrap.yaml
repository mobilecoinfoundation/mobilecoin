name: mobilecoin-workflow-dev-bootstrap

on:
  workflow_call:
    inputs:
      block_version:
        description: "block_version"
        type: string
        required: true
      namespace:
        description: "Target Namespace"
        type: string
        required: true
      bootstrap_version:
        description: "Bootstrap Blockchain from selected version"
        type: string
        required: true
      tokens_file:
        description: "Tokens File"
        type: string
        required: true
      domain_name:
        description: "Domain name for ingress hosts"
        type: string
        required: false
        default: development.mobilecoin.com
    secrets:
      DEV_LEDGER_AWS_ACCESS_KEY_ID:
        description: "Ledger AWS S3 access"
        required: true
      DEV_LEDGER_AWS_SECRET_ACCESS_KEY:
        description: "Ledger AWS S3 access"
        required: true
      DEV_POSTGRESQL_FOG_RECOVERY_PASSWORD:
        description: "password for fog_recovery database"
        required: true

jobs:
  reset:
    uses: ./.github/workflows/mobilecoin-workflow-dev-reset.yaml
    with:
      namespace: ${{ inputs.namespace }}
      domain_name: ${{ inputs.domain_name }}
    secrets: inherit

  restore-s3-archive:
    runs-on: mcf-dev-large-x64
    needs:
    - reset
    container:
      image: mobilecoin/gha-s3-pg-helper:v0
    steps:
    - name: Restore Ledger Archive from S3
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.DEV_LEDGER_AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.DEV_LEDGER_AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: eu-central-1
        BUCKET: mobilecoin.eu.development.chain
        NAMESPACE: ${{ inputs.namespace }}
        VERSION: ${{ inputs.bootstrap_version }}
      shell: bash
      run: |
        echo "[profile s3]" > /tmp/aws_cli_profile
        # shellcheck disable=SC2129 # style issue on multiple echo lines. The alternative is harder to read.
        echo "s3 =" >> /tmp/aws_cli_profile
        echo "  max_concurrent_requests = 50" >> /tmp/aws_cli_profile
        echo "  max_queue_size = 10000" >> /tmp/aws_cli_profile

        export AWS_CONFIG_FILE=/tmp/aws_cli_profile
        export AWS_PROFILE=s3

        for i in 1 2 3
        do
            aws s3 cp --only-show-errors --recursive --acl public-read \
                "s3://${BUCKET}/prebuilt/${VERSION}/chain/node${i}" \
                "s3://${BUCKET}/node${i}.${NAMESPACE}.${{ inputs.domain_name }}" &
            # capture pids
            pids[i]=$!
        done

        # wait for all pids to finish
        for pid in "${pids[@]}"
        do
            wait "${pid}"
        done

  setup-environment:
    uses: ./.github/workflows/mobilecoin-workflow-dev-setup-environment.yaml
    needs:
    - reset
    with:
      namespace: ${{ inputs.namespace }}
      tokens_file: ${{ inputs.tokens_file }}
      domain_name: ${{ inputs.domain_name }}
    secrets: inherit

  #  We now have a db with setup-environment
  #  Note this only works if we are in the same cluster as the dev env.
  restore-db-from-archive:
    runs-on: mcf-dev-small-x64
    needs:
    - setup-environment
    steps:
      - name: restore-db
        uses: mobilecoinofficial/gha-k8s-toolbox@v1
        with:
          action: helm-deploy-oci
          chart_repo: ghcr.io/mobilecoinofficial/charts
          chart_name: gha-s3-pg-helper
          chart_version: v0.0.8
          # chart_values: ${{ env.VALUES_BASE_PATH }}/consensus-node-values.yaml
          # chart_wait_timeout: 60m
          chart_set: |
            --set secret.data.AWS_ACCESS_KEY_ID=${{ secrets.DEV_LEDGER_AWS_ACCESS_KEY_ID }}
            --set secret.data.AWS_SECRET_ACCESS_KEY=${{ secrets.DEV_LEDGER_AWS_SECRET_ACCESS_KEY }}
            --set secret.data.AWS_DEFAULT_REGION=eu-central-1
            --set secret.data.BUCKET=mobilecoin.eu.development.chain
            --set secret.data.PGDATABASE=postgres
            --set secret.data.PGHOST=fog-recovery-postgresql-primary.${{ inputs.namespace }}
            --set secret.data.PGPASSWORD=${{ secrets.DEV_POSTGRESQL_FOG_RECOVERY_PASSWORD }}
            --set secret.data.PGUSER=postgres
            --set secret.data.VERSION=${{ inputs.bootstrap_version }}
          release_name: gha-s3-pg-helper
          namespace: ${{ inputs.namespace }}
          rancher_cluster: ${{ secrets.INFRA_RANCHER_CLUSTER }}
          rancher_url: ${{ secrets.DEV_RANCHER_URL }}
          rancher_token: ${{ secrets.DEV_RANCHER_TOKEN }}
          chart_repo_password: ${{ github.token }}
          chart_repo_username: ${{ github.actor }}

