# Fog View (FSG) — testnet overrides
#
# Router + Store architecture.
# Router: handles client gRPC requests
# Store: holds fog view shards, reads from recovery DB

imagePullSecrets:
- name: docker-credentials

image:
  org: mobilecoin
  name: fogview

fogView:
  color: 'blue'
  zone: ''
  responderID: ''

  ports:
    grpc: 3225
    http: 8225
    mgmt: 8000

  router:
    replicaCount: 1

    resources:
      limits:
        sgx.intel.com/epc: 512Ki
        memory: 3Gi
      requests:
        sgx.intel.com/epc: 512Ki
        memory: 3Gi
        cpu: 1100m

    nodeSelector:
      dcap: 'true'

    tolerations:
    - key: dcap
      operator: Equal
      value: 'true'
      effect: NoSchedule

    podAnnotations:
      sgx.intel.com/quote-provider: fog-view-router

    configMap:
      data:
        PLACEHOLDER: 'empty'

  store:
    replicaCount: 1

    resources:
      limits:
        sgx.intel.com/epc: 512Ki
        memory: 5Gi
      requests:
        sgx.intel.com/epc: 512Ki
        memory: 5Gi
        cpu: 1100m

    nodeSelector:
      dcap: 'true'

    tolerations:
    - key: dcap
      operator: Equal
      value: 'true'
      effect: NoSchedule

    podAnnotations:
      sgx.intel.com/quote-provider: fog-view-store
      cluster-autoscaler.kubernetes.io/safe-to-evict: 'false'

    configMap:
      data:
        POSTGRES_CONNECTION_TIMEOUT: '5'
        POSTGRES_MAX_CONNECTIONS: '3'
        MC_OMAP_CAPACITY: '4194304'

  externalConfigMaps:
    sentry:
      name: sentry
    postgresReader:
      name: fog-recovery-reader-0-postgresql

  externalSecrets:
    postgresReader:
      name: fog-recovery-reader-0-postgresql

  # Testnet shard config
  stackConfig:
    network:
      test:
        shardSize: 400000
        exceedBlockHeightBy: 10000
        count: 2

jaegerTracing:
  enabled: false
