[package]
name = "mc-wasm-test"
version = "7.2.0"
authors = ["MobileCoin"]
edition = "2021"
license = "GPL-3.0"
rust-version = { workspace = true }

[lib]
name = "mc_wasm_test"
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
# These are crates that we want to ensure build successfully for the wasm target
mc-account-keys = { workspace = true }
mc-api = { workspace = true }
mc-crypto-keys = { workspace = true }
mc-transaction-builder = { workspace = true }
mc-transaction-core = { workspace = true }

# These direct dependencies select JavaScript backends; this crate does not call
# getrandom itself. Exercise the workspace's current getrandom 0.4 backend.
getrandom = { workspace = true, features = ["wasm_js"] }
# mc-transaction-builder and mc-rand (through mc-common) use rand 0.8, which
# resolves a separate getrandom 0.2 package through rand_core 0.6. Cargo does not
# unify features across versions, so its older `js` backend must also be enabled.
getrandom-02 = { workspace = true, features = ["js"] }
rand = { workspace = true, features = ["getrandom"] }

# Used for very basic testing
wasm-bindgen = { workspace = true }
wasm-bindgen-test = { workspace = true }
