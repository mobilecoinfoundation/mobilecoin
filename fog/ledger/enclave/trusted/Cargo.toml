[package]
name = "mc-fog-ledger-enclave-trusted"
version = "7.2.0"
authors = ["MobileCoin"]
edition = "2021"
license = "GPL-3.0"
rust-version = { workspace = true }

# Declare as an empty workspace to not confuse cargo.
[workspace]
resolver = "3"

[workspace.package]
rust-version = "1.99.0"

[lib]
crate-type = ["staticlib"]

[features]
sgx-sim = ["mc-attest-verifier/sgx-sim"]

[dependencies]
# mobilecoin
mc-attest-core = { path = "../../../../attest/core", default-features = false }
mc-attest-verifier = { path = "../../../../attest/verifier", default-features = false }
mc-enclave-boundary = { path = "../../../../enclave-boundary" }
mc-sgx-compat = { path = "../../../../sgx/compat", features = ["sgx"] }
mc-sgx-debug-edl = { path = "../../../../sgx/debug-edl" }
mc-sgx-enclave-id = { path = "../../../../sgx/enclave-id" }
mc-sgx-panic-edl = { path = "../../../../sgx/panic-edl" }
mc-sgx-report-cache-api = { path = "../../../../sgx/report-cache/api" }
mc-sgx-slog = { path = "../../../../sgx/slog", features = ["sgx"] }
mc-sgx-slog-edl = { path = "../../../../sgx/slog-edl" }
mc-sgx-types = { path = "../../../../sgx/types" }
mc-util-serial = { path = "../../../../util/serial" }

# fog
mc-fog-ledger-enclave-api = { path = "../api", default-features = false }
mc-fog-ledger-enclave-edl = { path = "../edl" }
mc-fog-ledger-enclave-impl = { path = "../impl", default-features = false }
mc-fog-ocall-oram-storage-edl = { path = "../../../ocall_oram_storage/edl" }
mc-fog-ocall-oram-storage-trusted = { path = "../../../ocall_oram_storage/trusted" }

# third-party
lazy_static = "1.4"
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"] }

# And these to force features for SGX
mbedtls = { version = "0.8.1", default-features = false, features = ["no_std_deps", "aesni", "force_aesni_support", "rdrand"] }
mbedtls-sys-auto = { version = "2.26.1", default-features = false, features = ["custom_threading"] }

[build-dependencies]
mc-util-build-script = { path = "../../../../util/build/script" }
mc-util-build-sgx = { path = "../../../../util/build/sgx" }

cargo-emit = "0.2.1"
pkg-config = "0.3"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
rpath = false
lto = true
debug-assertions = false
overflow-checks = false

[patch.crates-io]
# Fork and rename to use "OG" dalek-cryptography with latest dependencies.
bulletproofs-og = { git = "https://github.com/mobilecoinfoundation/bulletproofs.git", rev = "e7ba85f847fd2beaa67448711de60d6dfd6ac052" }

# Additional rand 0.10 compatibility patches.
merlin = { git = "https://github.com/mobilecoinofficial/merlin.git", rev = "0bf3a40f3bc6a7e1fba59988fc3ed563093c69c5" }

# Patch cpufeatures 0.3 to avoid executing CPUID inside SGX enclaves.
cpufeatures = { git = "https://github.com/mobilecoinfoundation/RustCrypto-utils.git", rev = "b2e29356134eaec02a9c848cc6c1b2e8c244b20c" }

# Our patches for newer bindgen, no-std
mbedtls = { git = "https://github.com/mobilecoinfoundation/rust-mbedtls.git", rev = "0bddacc981ac782ca2e2f8aa5ffa25ce0e3d8273" }
mbedtls-sys-auto = { git = "https://github.com/mobilecoinfoundation/rust-mbedtls.git", rev = "0bddacc981ac782ca2e2f8aa5ffa25ce0e3d8273" }

# curve25519-dalek 5 and rand 0.10 support are not yet published upstream.
schnorrkel = { git = "https://github.com/mobilecoinfoundation/schnorrkel.git", rev = "65300ab0d2efaf7853f6eaa8cf6930116850e30a" }

# Fixes the following:
# * Allow enabling `serde/std` without also requiring `serde_cbor/std` to be enabled.
#   See: https://github.com/pyfisch/cbor/pull/198
serde_cbor = { git = "https://github.com/mobilecoinofficial/cbor", rev = "4c886a7c1d523aae1ec4aa7386f402cb2f4341b5" }
