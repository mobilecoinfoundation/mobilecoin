[package]
name = "mc-fog-ledger-enclave-trusted"
version = "7.2.0"
authors = ["MobileCoin"]
edition = "2021"
license = "GPL-3.0"
rust-version = { workspace = true }

# Declare as an empty workspace to not confuse cargo.
[workspace]
resolver = "3"

[workspace.package]
rust-version = "1.99.0"

[lib]
crate-type = ["staticlib"]

[features]
sgx-sim = ["mc-attest-verifier/sgx-sim"]

[dependencies]
# mobilecoin
mc-attest-core = { path = "../../../../attest/core", default-features = false }
mc-attest-verifier = { path = "../../../../attest/verifier", default-features = false }
mc-enclave-boundary = { path = "../../../../enclave-boundary" }
mc-sgx-compat = { path = "../../../../sgx/compat", features = ["sgx"] }
mc-sgx-debug-edl = { path = "../../../../sgx/debug-edl" }
mc-sgx-enclave-id = { path = "../../../../sgx/enclave-id" }
mc-sgx-panic-edl = { path = "../../../../sgx/panic-edl" }
mc-sgx-report-cache-api = { path = "../../../../sgx/report-cache/api" }
mc-sgx-slog = { path = "../../../../sgx/slog", features = ["sgx"] }
mc-sgx-slog-edl = { path = "../../../../sgx/slog-edl" }
mc-sgx-types = { path = "../../../../sgx/types" }
mc-util-serial = { path = "../../../../util/serial" }

# fog
mc-fog-ledger-enclave-api = { path = "../api", default-features = false }
mc-fog-ledger-enclave-edl = { path = "../edl" }
mc-fog-ledger-enclave-impl = { path = "../impl", default-features = false }
mc-fog-ocall-oram-storage-edl = { path = "../../../ocall_oram_storage/edl" }
mc-fog-ocall-oram-storage-trusted = { path = "../../../ocall_oram_storage/trusted" }

# third-party
lazy_static = "1.4"
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"] }

# And these to force features for SGX
mbedtls = { version = "0.8.1", default-features = false, features = ["no_std_deps", "aesni", "force_aesni_support", "rdrand"] }
mbedtls-sys-auto = { version = "2.26.1", default-features = false, features = ["custom_threading"] }

[build-dependencies]
mc-util-build-script = { path = "../../../../util/build/script" }
mc-util-build-sgx = { path = "../../../../util/build/sgx" }

cargo-emit = "0.2.1"
pkg-config = "0.3"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
rpath = false
lto = true
debug-assertions = false
overflow-checks = false

[patch.crates-io]
mc-attestation-verifier = { git = "https://github.com/mobilecoinfoundation/attestation.git", rev = "5d69473154f8ed7e84402d83a01428acedf4904e" }

# Fork and rename to use "OG" dalek-cryptography with latest dependencies.
bulletproofs-og = { git = "https://github.com/mobilecoinfoundation/bulletproofs.git", rev = "e7ba85f847fd2beaa67448711de60d6dfd6ac052" }

# rand 0.10 support is not yet published for these MobileCoin crates.
aligned-array = { git = "https://github.com/eranrund/aligned-array.git", rev = "fa257e47b3a05ed885a57d2a71c134908734621b" }
aligned-cmov = { git = "https://github.com/mobilecoinfoundation/mc-oblivious.git", rev = "de654fea0cf963e358dae31a5598b000c87c482f" }
balanced-tree-index = { git = "https://github.com/mobilecoinfoundation/mc-oblivious.git", rev = "de654fea0cf963e358dae31a5598b000c87c482f" }
mc-oblivious-map = { git = "https://github.com/mobilecoinfoundation/mc-oblivious.git", rev = "de654fea0cf963e358dae31a5598b000c87c482f" }
mc-oblivious-ram = { git = "https://github.com/mobilecoinfoundation/mc-oblivious.git", rev = "de654fea0cf963e358dae31a5598b000c87c482f" }
mc-oblivious-traits = { git = "https://github.com/mobilecoinfoundation/mc-oblivious.git", rev = "de654fea0cf963e358dae31a5598b000c87c482f" }
mc-rand = { git = "https://github.com/mobilecoinfoundation/rand.git", rev = "edda1b36ea51f73c4cd34b260d5186b3ef73d0c3" }
merlin = { git = "https://github.com/mobilecoinofficial/merlin.git", rev = "f99baaddf207cd260f07c6c9485d034171c5e277" }

# SGX 0.13 and rand 0.10 support are not yet published.
mc-sgx-core-sys-types = { git = "https://github.com/mobilecoinfoundation/sgx.git", rev = "2e4b90132a6f2a71a4d76ad2ca5c29ee8a7100d1" }
mc-sgx-core-types = { git = "https://github.com/mobilecoinfoundation/sgx.git", rev = "2e4b90132a6f2a71a4d76ad2ca5c29ee8a7100d1" }
mc-sgx-dcap-sys-types = { git = "https://github.com/mobilecoinfoundation/sgx.git", rev = "2e4b90132a6f2a71a4d76ad2ca5c29ee8a7100d1" }
mc-sgx-dcap-types = { git = "https://github.com/mobilecoinfoundation/sgx.git", rev = "2e4b90132a6f2a71a4d76ad2ca5c29ee8a7100d1" }

# Some transitive dependencies use cpufeatures 0.2 while others use 0.3; patch both
# versions to avoid executing CPUID in SGX.
cpufeatures-03 = { package = "cpufeatures", git = "https://github.com/mobilecoinfoundation/RustCrypto-utils.git", rev = "b2e29356134eaec02a9c848cc6c1b2e8c244b20c" }

# Our patches for newer bindgen, no-std
mbedtls = { git = "https://github.com/mobilecoinfoundation/rust-mbedtls.git", rev = "0bddacc981ac782ca2e2f8aa5ffa25ce0e3d8273" }
mbedtls-sys-auto = { git = "https://github.com/mobilecoinfoundation/rust-mbedtls.git", rev = "0bddacc981ac782ca2e2f8aa5ffa25ce0e3d8273" }

# curve25519-dalek 5 and rand 0.10 support are not yet published upstream.
schnorrkel = { git = "https://github.com/mobilecoinfoundation/schnorrkel.git", rev = "f6199f4130e145bc4deadeea8daec5dc2cb23586" }

# Fixes the following:
# * Allow enabling `serde/std` without also requiring `serde_cbor/std` to be enabled.
#   See: https://github.com/pyfisch/cbor/pull/198
serde_cbor = { git = "https://github.com/mobilecoinofficial/cbor", rev = "4c886a7c1d523aae1ec4aa7386f402cb2f4341b5" }
